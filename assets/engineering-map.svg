<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"/>
      <stop offset="0.52" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#101525"/>
    </linearGradient>
    <linearGradient id="line" x1="100" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tinyGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .pulse2 { animation: pulse 2.8s ease-in-out .7s infinite; }
    .pulse3 { animation: pulse 2.8s ease-in-out 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  </style>

  <rect width="1200" height="300" rx="22" fill="url(#bg2)"/>
  <rect width="1200" height="300" rx="22" fill="url(#tinyGrid)"/>

  <text x="52" y="48" class="mono" font-size="15" fill="#64748B">engineering.map  //  projects grouped by the problems they solve</text>

  <path d="M210 150H390" stroke="url(#line)" stroke-opacity=".38" stroke-width="2"/>
  <path d="M510 150H690" stroke="url(#line)" stroke-opacity=".38" stroke-width="2"/>
  <path d="M810 150H990" stroke="url(#line)" stroke-opacity=".38" stroke-width="2"/>
  <path d="M450 110V76H750V110" stroke="url(#line)" stroke-opacity=".2" stroke-width="2"/>
  <path d="M450 190V224H750V190" stroke="url(#line)" stroke-opacity=".2" stroke-width="2"/>

  <g>
    <rect x="55" y="105" width="155" height="90" rx="15" fill="#0F172A" stroke="#22D3EE" stroke-opacity=".45"/>
    <text x="78" y="136" class="mono" font-size="13" fill="#67E8F9">SYSTEMS</text>
    <text x="78" y="162" class="label" font-size="17" font-weight="700" fill="#E2E8F0">IRC · 42 · Shell</text>
    <text x="78" y="182" class="mono" font-size="12" fill="#64748B">C / C++ / Unix</text>
  </g>

  <g>
    <rect x="390" y="105" width="120" height="90" rx="15" fill="#0F172A" stroke="#818CF8" stroke-opacity=".55"/>
    <text x="414" y="137" class="mono" font-size="13" fill="#A5B4FC">STATE</text>
    <text x="414" y="162" class="label" font-size="16" font-weight="700" fill="#E2E8F0">Convex</text>
    <text x="414" y="181" class="mono" font-size="12" fill="#64748B">realtime</text>
  </g>

  <g>
    <rect x="690" y="105" width="120" height="90" rx="15" fill="#0F172A" stroke="#A78BFA" stroke-opacity=".55"/>
    <text x="713" y="137" class="mono" font-size="13" fill="#C4B5FD">NETWORK</text>
    <text x="713" y="162" class="label" font-size="16" font-weight="700" fill="#E2E8F0">WS · APIs</text>
    <text x="713" y="181" class="mono" font-size="12" fill="#64748B">webhooks</text>
  </g>

  <g>
    <rect x="990" y="105" width="155" height="90" rx="15" fill="#0F172A" stroke="#C084FC" stroke-opacity=".45"/>
    <text x="1013" y="136" class="mono" font-size="13" fill="#D8B4FE">PRODUCT</text>
    <text x="1013" y="162" class="label" font-size="17" font-weight="700" fill="#E2E8F0">Ops · AI · Web</text>
    <text x="1013" y="182" class="mono" font-size="12" fill="#64748B">ship usable tools</text>
  </g>

  <g>
    <rect x="515" y="64" width="170" height="48" rx="13" fill="#0B1220" stroke="#818CF8" stroke-opacity=".28"/>
    <text x="537" y="93" class="label" font-size="14" font-weight="700" fill="#CBD5E1">MINA GAMES · Eclipse</text>
  </g>

  <g>
    <rect x="515" y="188" width="170" height="48" rx="13" fill="#0B1220" stroke="#818CF8" stroke-opacity=".28"/>
    <text x="536" y="217" class="label" font-size="14" font-weight="700" fill="#CBD5E1">Real Estate · Audify</text>
  </g>

  <circle class="pulse" cx="300" cy="150" r="5" fill="#22D3EE" filter="url(#softGlow)">
    <animate attributeName="cx" values="210;390" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle class="pulse2" cx="600" cy="150" r="5" fill="#818CF8" filter="url(#softGlow)">
    <animate attributeName="cx" values="510;690" dur="2.35s" repeatCount="indefinite"/>
  </circle>
  <circle class="pulse3" cx="900" cy="150" r="5" fill="#C084FC" filter="url(#softGlow)">
    <animate attributeName="cx" values="810;990" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <text x="52" y="270" class="mono" font-size="13" fill="#475569">code → state → network → product</text>
  <text x="1147" y="270" text-anchor="end" class="mono" font-size="13" fill="#475569">iamhashir</text>
</svg>