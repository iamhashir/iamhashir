<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="54" y1="16" x2="1140" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A0F"/>
      <stop offset="0.55" stop-color="#0B111B"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="96" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1032 174) rotate(90) scale(190)">
      <stop stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .dash { animation: dash 3.4s linear infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    .pulse2 { animation: pulse 2.6s ease-in-out .8s infinite; }
    .pulse3 { animation: pulse 2.6s ease-in-out 1.6s infinite; }
    @keyframes dash { to { stroke-dashoffset: -42; } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.86); } 50% { opacity:1; transform:scale(1.12); } }
  </style>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" stroke="#94A3B8" stroke-opacity="0.16"/>
  <circle cx="1032" cy="174" r="190" fill="url(#orb)"/>

  <g>
    <rect x="62" y="48" width="128" height="28" rx="14" fill="#0F172A" stroke="#67E8F9" stroke-opacity="0.28"/>
    <circle cx="80" cy="62" r="4" fill="#67E8F9" filter="url(#glow)"/>
    <text x="94" y="67" class="mono" font-size="12" fill="#CBD5E1" letter-spacing="1.4">AVAILABLE</text>
  </g>

  <text x="62" y="128" class="sans" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="-1.8">MALIK HASHIR</text>
  <text x="64" y="165" class="mono" font-size="16" fill="url(#accent)" letter-spacing="1.6">SOFTWARE ENGINEER / ABU DHABI</text>
  <text x="64" y="210" class="sans" font-size="22" font-weight="600" fill="#CBD5E1">Full-stack products. Realtime systems. Low-level engineering. AI workflows.</text>
  <text x="64" y="244" class="sans" font-size="15" fill="#64748B">I build where interface, state, data and infrastructure have to agree.</text>

  <g transform="translate(64 282)">
    <rect width="94" height="30" rx="8" fill="#0B1220" stroke="#334155"/>
    <text x="47" y="20" text-anchor="middle" class="mono" font-size="12" fill="#CBD5E1">WEB</text>
    <rect x="104" width="104" height="30" rx="8" fill="#0B1220" stroke="#334155"/>
    <text x="156" y="20" text-anchor="middle" class="mono" font-size="12" fill="#CBD5E1">MOBILE</text>
    <rect x="218" width="118" height="30" rx="8" fill="#0B1220" stroke="#334155"/>
    <text x="277" y="20" text-anchor="middle" class="mono" font-size="12" fill="#CBD5E1">SYSTEMS</text>
    <rect x="346" width="88" height="30" rx="8" fill="#0B1220" stroke="#334155"/>
    <text x="390" y="20" text-anchor="middle" class="mono" font-size="12" fill="#CBD5E1">AI</text>
  </g>

  <g opacity="0.92">
    <path class="dash" d="M710 98H820M894 98H1004M1068 98V158M1004 214H894M820 214H710" stroke="url(#accent)" stroke-width="2" stroke-dasharray="7 8" stroke-linecap="round"/>
    <path class="dash" d="M857 128V184" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round"/>

    <g>
      <rect x="650" y="72" width="128" height="52" rx="12" fill="#0B1220" stroke="#334155"/>
      <text x="714" y="94" text-anchor="middle" class="mono" font-size="11" fill="#64748B">01</text>
      <text x="714" y="112" text-anchor="middle" class="mono" font-size="13" fill="#E2E8F0">INTERFACE</text>
    </g>
    <g>
      <rect x="820" y="72" width="74" height="52" rx="12" fill="#0B1220" stroke="#334155"/>
      <text x="857" y="94" text-anchor="middle" class="mono" font-size="11" fill="#64748B">02</text>
      <text x="857" y="112" text-anchor="middle" class="mono" font-size="13" fill="#E2E8F0">STATE</text>
    </g>
    <g>
      <rect x="1004" y="72" width="128" height="52" rx="12" fill="#0B1220" stroke="#334155"/>
      <text x="1068" y="94" text-anchor="middle" class="mono" font-size="11" fill="#64748B">03</text>
      <text x="1068" y="112" text-anchor="middle" class="mono" font-size="13" fill="#E2E8F0">API / WS</text>
    </g>
    <g>
      <rect x="1004" y="188" width="128" height="52" rx="12" fill="#0B1220" stroke="#334155"/>
      <text x="1068" y="210" text-anchor="middle" class="mono" font-size="11" fill="#64748B">04</text>
      <text x="1068" y="228" text-anchor="middle" class="mono" font-size="13" fill="#E2E8F0">DATA</text>
    </g>
    <g>
      <rect x="820" y="188" width="74" height="52" rx="12" fill="#0B1220" stroke="#334155"/>
      <text x="857" y="210" text-anchor="middle" class="mono" font-size="11" fill="#64748B">05</text>
      <text x="857" y="228" text-anchor="middle" class="mono" font-size="13" fill="#E2E8F0">SYNC</text>
    </g>
    <g>
      <rect x="650" y="188" width="128" height="52" rx="12" fill="#0B1220" stroke="#334155"/>
      <text x="714" y="210" text-anchor="middle" class="mono" font-size="11" fill="#64748B">06</text>
      <text x="714" y="228" text-anchor="middle" class="mono" font-size="13" fill="#E2E8F0">RUNTIME</text>
    </g>

    <circle class="pulse" cx="804" cy="98" r="5" fill="#67E8F9" filter="url(#glow)"/>
    <circle class="pulse2" cx="948" cy="98" r="5" fill="#818CF8" filter="url(#glow)"/>
    <circle class="pulse3" cx="1068" cy="157" r="5" fill="#C084FC" filter="url(#glow)"/>
    <circle class="pulse" cx="948" cy="214" r="5" fill="#818CF8" filter="url(#glow)"/>
    <circle class="pulse2" cx="804" cy="214" r="5" fill="#67E8F9" filter="url(#glow)"/>

    <text x="891" y="279" text-anchor="middle" class="mono" font-size="12" fill="#475569" letter-spacing="1.2">PRODUCT → STATE → NETWORK → DATA → RUNTIME</text>
  </g>
</svg>