<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="54" y1="16" x2="1140" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A0F"/>
      <stop offset="0.55" stop-color="#0B111B"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="96" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 180) rotate(90) scale(220)">
      <stop stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
  </style>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" stroke="#94A3B8" stroke-opacity="0.16"/>
  <circle cx="1010" cy="180" r="220" fill="url(#orb)"/>

  <!-- identity -->
  <g>
    <rect x="62" y="42" width="150" height="28" rx="14" fill="#0F172A" stroke="#67E8F9" stroke-opacity="0.28"/>
    <circle class="pulse" cx="80" cy="56" r="4" fill="#67E8F9" filter="url(#glow)"/>
    <text x="94" y="61" class="mono" font-size="11" fill="#CBD5E1" letter-spacing="1.2">OPEN TO ROLES</text>
  </g>

  <text x="62" y="124" class="sans" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="-1.8">MALIK HASHIR</text>
  <text x="64" y="160" class="mono" font-size="15" fill="url(#accent)" letter-spacing="1.4">SOFTWARE ENGINEER · ABU DHABI, UAE</text>

  <text x="64" y="207" class="sans" font-size="21" font-weight="650" fill="#E2E8F0">Full-stack &amp; backend systems · Realtime applications · C/C++</text>
  <text x="64" y="239" class="sans" font-size="15" fill="#64748B">Building state-heavy products, networked systems and developer tooling.</text>

  <!-- stack chips -->
  <g transform="translate(64 282)">
    <rect width="112" height="30" rx="8" fill="#0B1220" stroke="#334155"/>
    <text x="56" y="20" text-anchor="middle" class="mono" font-size="11" fill="#CBD5E1">TYPESCRIPT</text>

    <rect x="122" width="96" height="30" rx="8" fill="#0B1220" stroke="#334155"/>
    <text x="170" y="20" text-anchor="middle" class="mono" font-size="11" fill="#CBD5E1">NODE.JS</text>

    <rect x="228" width="112" height="30" rx="8" fill="#0B1220" stroke="#334155"/>
    <text x="284" y="20" text-anchor="middle" class="mono" font-size="11" fill="#CBD5E1">WEBSOCKETS</text>

    <rect x="350" width="72" height="30" rx="8" fill="#0B1220" stroke="#334155"/>
    <text x="386" y="20" text-anchor="middle" class="mono" font-size="11" fill="#CBD5E1">C++</text>
  </g>

  <!-- recruiter proof panel -->
  <g>
    <rect x="666" y="48" width="466" height="264" rx="18" fill="#0A101B" fill-opacity="0.72" stroke="#334155" stroke-opacity="0.9"/>
    <rect x="666" y="48" width="4" height="264" rx="2" fill="url(#accent)"/>

    <text x="700" y="82" class="mono" font-size="11" fill="#64748B" letter-spacing="1.5">ENGINEERING HIGHLIGHTS</text>
    <text x="700" y="108" class="sans" font-size="15" font-weight="600" fill="#CBD5E1">Concrete systems worth opening.</text>

    <line x1="700" y1="126" x2="1098" y2="126" stroke="#334155" stroke-opacity="0.75"/>

    <g>
      <rect x="700" y="145" width="34" height="34" rx="9" fill="#0F172A" stroke="#67E8F9" stroke-opacity="0.28"/>
      <text x="717" y="167" text-anchor="middle" class="mono" font-size="11" fill="#67E8F9">01</text>
      <text x="754" y="159" class="sans" font-size="16" font-weight="650" fill="#F1F5F9">Custom JSX runtime</text>
      <text x="754" y="178" class="mono" font-size="11" fill="#64748B">rendering · state · lifecycle · routing</text>
    </g>

    <g>
      <rect x="700" y="201" width="34" height="34" rx="9" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.32"/>
      <text x="717" y="223" text-anchor="middle" class="mono" font-size="11" fill="#818CF8">02</text>
      <text x="754" y="215" class="sans" font-size="16" font-weight="650" fill="#F1F5F9">Realtime multiplayer platform</text>
      <text x="754" y="234" class="mono" font-size="11" fill="#64748B">WebSockets · Fastify · Docker</text>
    </g>

    <g>
      <rect x="700" y="257" width="34" height="34" rx="9" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.32"/>
      <text x="717" y="279" text-anchor="middle" class="mono" font-size="11" fill="#C084FC">03</text>
      <text x="754" y="271" class="sans" font-size="16" font-weight="650" fill="#F1F5F9">C++ TCP / IRC server</text>
      <text x="754" y="290" class="mono" font-size="11" fill="#64748B">non-blocking I/O · poll() · protocols</text>
    </g>
  </g>
</svg>