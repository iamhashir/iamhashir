<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="30" y1="20" x2="1180" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05080D"/>
      <stop offset="0.52" stop-color="#09111B"/>
      <stop offset="1" stop-color="#0D1524"/>
    </linearGradient>
    <linearGradient id="signal" x1="690" y1="90" x2="1140" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="nameAccent" x1="62" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(965 177) rotate(90) scale(235 320)">
      <stop stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#94A3B8" stroke-opacity="0.04"/>
    </pattern>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 5.5H6" stroke="#E2E8F0" stroke-opacity="0.018"/>
    </pattern>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .packet { animation: packet 4.8s linear infinite; }
    .packet2 { animation: packet 4.8s linear 1.6s infinite; }
    .packet3 { animation: packet 4.8s linear 3.2s infinite; }
    .blink { animation: blink 1.3s steps(1,end) infinite; }
    .node1 { animation: node 3.2s ease-in-out infinite; }
    .node2 { animation: node 3.2s ease-in-out 1s infinite; }
    .node3 { animation: node 3.2s ease-in-out 2s infinite; }
    @keyframes packet { 0% { opacity:0; transform:translateX(-36px); } 12% { opacity:1; } 80% { opacity:1; } 100% { opacity:0; transform:translateX(390px); } }
    @keyframes blink { 50% { opacity:.15; } }
    @keyframes node { 0%,100% { opacity:.45; } 50% { opacity:1; } }
  </style>

  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="26" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="358" rx="25" stroke="#94A3B8" stroke-opacity="0.15"/>
  <ellipse cx="970" cy="178" rx="315" ry="226" fill="url(#halo)"/>

  <!-- left identity -->
  <text x="62" y="52" class="mono" font-size="12" fill="#67E8F9" letter-spacing="1.6">&gt; WHOAMI</text>
  <rect x="143" y="40" width="8" height="15" rx="2" fill="#67E8F9" class="blink"/>

  <text x="62" y="119" class="sans" font-size="58" font-weight="850" fill="#F8FAFC" letter-spacing="-2">MALIK HASHIR</text>
  <rect x="63" y="132" width="74" height="3" rx="1.5" fill="url(#nameAccent)"/>

  <text x="63" y="170" class="mono" font-size="14" fill="#94A3B8" letter-spacing="1.25">SOFTWARE ENGINEER // ABU DHABI, UAE</text>

  <text x="62" y="216" class="sans" font-size="20" font-weight="650" fill="#E2E8F0">Realtime products. Backend systems. C/C++.</text>
  <text x="62" y="247" class="sans" font-size="15" fill="#64748B">I like the parts that still have to work when state gets messy.</text>

  <g transform="translate(62 286)">
    <circle cx="5" cy="6" r="4" fill="#67E8F9" filter="url(#glow)"/>
    <text x="20" y="10" class="mono" font-size="11" fill="#94A3B8" letter-spacing="1">TYPESCRIPT</text>
    <circle cx="120" cy="6" r="3" fill="#334155"/>
    <text x="135" y="10" class="mono" font-size="11" fill="#94A3B8" letter-spacing="1">NODE.JS</text>
    <circle cx="222" cy="6" r="3" fill="#334155"/>
    <text x="237" y="10" class="mono" font-size="11" fill="#94A3B8" letter-spacing="1">WEBSOCKETS</text>
    <circle cx="360" cy="6" r="3" fill="#334155"/>
    <text x="375" y="10" class="mono" font-size="11" fill="#94A3B8" letter-spacing="1">C++</text>
  </g>

  <text x="62" y="332" class="mono" font-size="10" fill="#475569" letter-spacing="1.35">OPEN TO SOFTWARE ENGINEERING ROLES</text>

  <!-- giant signature monogram -->
  <text x="706" y="250" class="sans" font-size="190" font-weight="900" fill="none" stroke="#94A3B8" stroke-opacity="0.055" stroke-width="2" letter-spacing="-18">MH</text>

  <!-- signal trace -->
  <text x="705" y="51" class="mono" font-size="10" fill="#64748B" letter-spacing="1.8">ENGINEERING SIGNAL // 03</text>
  <line x1="705" y1="62" x2="1127" y2="62" stroke="#334155" stroke-opacity="0.7"/>

  <path d="M704 188 C748 188 745 111 792 111 S847 222 901 222 S949 137 1000 137 S1052 188 1128 188" stroke="#1E293B" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  <path d="M704 188 C748 188 745 111 792 111 S847 222 901 222 S949 137 1000 137 S1052 188 1128 188" stroke="url(#signal)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- moving packets -->
  <g opacity="0.95">
    <circle class="packet" cx="724" cy="188" r="5" fill="#67E8F9" filter="url(#glow)"/>
    <circle class="packet2" cx="724" cy="188" r="4" fill="#818CF8" filter="url(#glow)"/>
    <circle class="packet3" cx="724" cy="188" r="4" fill="#C084FC" filter="url(#glow)"/>
  </g>

  <!-- proof node 1 -->
  <g class="node1">
    <circle cx="792" cy="111" r="8" fill="#07111A" stroke="#67E8F9" stroke-width="2"/>
    <circle cx="792" cy="111" r="3" fill="#67E8F9"/>
  </g>
  <text x="776" y="88" text-anchor="end" class="mono" font-size="10" fill="#67E8F9" letter-spacing="1">01</text>
  <text x="776" y="101" text-anchor="end" class="sans" font-size="13" font-weight="700" fill="#E2E8F0">CUSTOM JSX</text>
  <text x="776" y="116" text-anchor="end" class="mono" font-size="10" fill="#64748B">runtime / state / lifecycle</text>

  <!-- proof node 2 -->
  <g class="node2">
    <circle cx="901" cy="222" r="8" fill="#0B1020" stroke="#818CF8" stroke-width="2"/>
    <circle cx="901" cy="222" r="3" fill="#818CF8"/>
  </g>
  <text x="917" y="248" class="mono" font-size="10" fill="#818CF8" letter-spacing="1">02</text>
  <text x="917" y="264" class="sans" font-size="13" font-weight="700" fill="#E2E8F0">REALTIME MULTIPLAYER</text>
  <text x="917" y="279" class="mono" font-size="10" fill="#64748B">WebSockets / Fastify / Docker</text>

  <!-- proof node 3 -->
  <g class="node3">
    <circle cx="1000" cy="137" r="8" fill="#120D1B" stroke="#C084FC" stroke-width="2"/>
    <circle cx="1000" cy="137" r="3" fill="#C084FC"/>
  </g>
  <text x="1017" y="107" class="mono" font-size="10" fill="#C084FC" letter-spacing="1">03</text>
  <text x="1017" y="123" class="sans" font-size="13" font-weight="700" fill="#E2E8F0">TCP / IRC SERVER</text>
  <text x="1017" y="138" class="mono" font-size="10" fill="#64748B">C++98 / poll() / protocols</text>

  <!-- telemetry bits -->
  <g opacity="0.72">
    <line x1="706" y1="309" x2="1128" y2="309" stroke="#334155" stroke-opacity="0.8"/>
    <text x="706" y="329" class="mono" font-size="10" fill="#475569" letter-spacing="1.1">BUILD</text>
    <text x="793" y="329" class="mono" font-size="10" fill="#475569" letter-spacing="1.1">SHIP</text>
    <text x="874" y="329" class="mono" font-size="10" fill="#475569" letter-spacing="1.1">SYNC</text>
    <text x="958" y="329" class="mono" font-size="10" fill="#475569" letter-spacing="1.1">DEBUG</text>
    <text x="1060" y="329" class="mono" font-size="10" fill="#475569" letter-spacing="1.1">SCALE</text>
  </g>
</svg>