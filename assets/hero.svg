<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B12"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="typingClip"><rect x="148" y="112" width="0" height="54" rx="2">
      <animate attributeName="width" values="0;760;760" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .blink { animation: blink 1s steps(2,end) infinite; }
    .float1 { animation: float1 6s ease-in-out infinite; transform-origin: center; }
    .float2 { animation: float2 8s ease-in-out infinite; transform-origin: center; }
    .scan { animation: scan 5s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes blink { 0%,45%{opacity:1} 46%,100%{opacity:0} }
    @keyframes float1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    @keyframes float2 { 0%,100%{transform:translateY(0) translateX(0)} 50%{transform:translateY(10px) translateX(-8px)} }
    @keyframes scan { 0%{transform:translateX(-300px)} 100%{transform:translateX(1350px)} }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  </style>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <circle class="float1" cx="1060" cy="78" r="66" fill="#22D3EE" fill-opacity="0.06" stroke="#67E8F9" stroke-opacity="0.25"/>
  <circle class="float2" cx="1100" cy="240" r="100" fill="#8B5CF6" fill-opacity="0.05" stroke="#A78BFA" stroke-opacity="0.18"/>
  <circle class="pulse" cx="1018" cy="112" r="5" fill="#67E8F9" filter="url(#glow)"/>
  <circle class="pulse" cx="1088" cy="194" r="4" fill="#A78BFA" filter="url(#glow)" style="animation-delay:.7s"/>
  <circle class="pulse" cx="994" cy="236" r="3" fill="#C084FC" filter="url(#glow)" style="animation-delay:1.3s"/>

  <rect x="64" y="48" width="840" height="224" rx="18" fill="#0B1220" fill-opacity="0.78" stroke="#64748B" stroke-opacity="0.22"/>
  <circle cx="90" cy="74" r="5" fill="#FB7185"/>
  <circle cx="108" cy="74" r="5" fill="#FACC15"/>
  <circle cx="126" cy="74" r="5" fill="#4ADE80"/>

  <text x="86" y="116" class="mono" font-size="18" fill="#94A3B8">$ whoami</text>
  <g clip-path="url(#typingClip)">
    <text x="86" y="158" class="sans" font-size="42" font-weight="800" fill="url(#accent)">Malik Hashir</text>
  </g>
  <rect class="blink" x="344" y="126" width="4" height="38" rx="2" fill="#67E8F9"/>

  <text x="86" y="198" class="mono" font-size="17" fill="#CBD5E1">software engineer  //  full-stack  //  systems  //  AI automation</text>
  <text x="86" y="230" class="mono" font-size="15" fill="#64748B">Abu Dhabi, UAE  ·  github.com/iamhashir</text>

  <g class="scan" opacity="0.5">
    <rect x="0" y="0" width="180" height="320" fill="url(#accent)" fill-opacity="0.04"/>
  </g>

  <path d="M939 156C979 124 1021 152 1048 122C1074 93 1118 108 1140 83" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="2s" repeatCount="indefinite"/>
  </path>
  <text x="956" y="286" class="mono" font-size="13" fill="#64748B">BUILD / SHIP / UNDERSTAND</text>
</svg>